<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="corpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f3d792;stop-opacity:1"/>
      <stop offset="45%" style="stop-color:#c9962f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8a5a1a;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="gearBrass" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#f7e2ad"/>
      <stop offset="42%" stop-color="#d8a63f"/>
      <stop offset="78%" stop-color="#a5701f"/>
      <stop offset="100%" stop-color="#5e3a10"/>
    </radialGradient>
  </defs>

  <!-- Engrenagem com a letra D -->
  <g transform="translate(50 60)">
    <g fill="url(#gearBrass)" stroke="#3a2308" stroke-width="1.5">
      <circle r="34"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(0)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(30)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(60)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(90)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(120)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(150)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(180)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(210)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(240)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(270)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(300)"/>
      <rect x="-5.5" y="-46" width="11" height="14" rx="2" transform="rotate(330)"/>
    </g>
    <circle r="26" fill="none" stroke="#4a2d09" stroke-width="1.6" opacity="0.85"/>
    <circle r="17" fill="#2a1a0e" stroke="#f0cd7a" stroke-width="1.4"/>
    <text x="0" y="7" text-anchor="middle"
          font-family="'Cinzel', 'Lora', serif" font-size="22" font-weight="700"
          fill="#f3d792">D</text>
    <circle cx="-10" cy="-11" r="2.2" fill="#ffe8b0" opacity="0.45"/>
  </g>

  <!-- Nome -->
  <text x="105" y="46" font-family="'Cinzel', 'Lora', serif" font-size="28" font-weight="700"
        letter-spacing="1" fill="#f3e3c3">DANIEL</text>

  <text x="105" y="78" font-family="'Cinzel', 'Lora', serif" font-size="28" font-weight="700"
        letter-spacing="1" fill="url(#corpGrad)">DIAS</text>

  <!-- Linha decorativa com rebites -->
  <line x1="105" y1="88" x2="288" y2="88" stroke="url(#corpGrad)" stroke-width="1.6" opacity="0.55"/>
  <circle cx="110" cy="88" r="2.4" fill="#c9962f"/>
  <circle cx="196" cy="88" r="2.4" fill="#c9962f"/>
  <circle cx="283" cy="88" r="2.4" fill="#c9962f"/>
</svg>
