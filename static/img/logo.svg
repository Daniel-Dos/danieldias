<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="corpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Ícone: Quadrado com D -->
  <g style="fill:rgb(0, 0, 0);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <!-- Fundo do ícone -->
    <rect x="10" y="20" width="80" height="80" rx="12" fill="url(#corpGrad)" style="stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    
    <!-- Letra D em branco -->
    <text x="50" y="75" font-family="'Courier New', monospace" font-size="48" font-weight="bold" text-anchor="middle" fill="white" dominant-baseline="middle" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Courier New&quot;, monospace;font-size:48px;font-weight:700;text-anchor:middle;dominant-baseline:middle">
      D
    </text>
  </g>

  <!-- Nome em texto -->
  <text x="105" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e293b" style="fill:rgb(30, 41, 59);stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, Arial, sans-serif;font-size:28px;font-weight:700;text-anchor:start;dominant-baseline:auto">
    DANIEL
  </text>
  
  <text x="105" y="75" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#corpGrad)" style="stroke:none;color:rgb(251, 251, 254);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Segoe UI&quot;, Arial, sans-serif;font-size:28px;font-weight:700;text-anchor:start;dominant-baseline:auto">
    DIAS
  </text>

  <!-- Linha decorativa -->
  <line x1="105" y1="85" x2="290" y2="85" stroke="url(#corpGrad)" stroke-width="2" opacity="0.5" style="fill:rgb(0, 0, 0);color:rgb(251, 251, 254);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>